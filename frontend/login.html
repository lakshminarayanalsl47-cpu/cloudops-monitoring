<!DOCTYPE html>
<html>
<head>
    <title>CloudOps Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">
        <h1>CloudOps Dashboard</h1>
        <p>AWS Monitoring Portal</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
